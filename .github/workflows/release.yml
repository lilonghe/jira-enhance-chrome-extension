name: Release Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate tag version
        run: |
          set -euo pipefail
          manifest_version="$(node -p "require('./manifest.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$manifest_version" != "$tag_version" ]; then
            echo "Tag version ($tag_version) does not match manifest version ($manifest_version)."
            exit 1
          fi

      - name: Build extension package
        run: bash ./scripts/package-extension.sh "dist/jira-enhance-${GITHUB_REF_NAME}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-enhance-${{ github.ref_name }}
          path: dist/jira-enhance-${{ github.ref_name }}.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Jira Enhance ${{ github.ref_name }}
          files: dist/jira-enhance-${{ github.ref_name }}.zip
          generate_release_notes: true
